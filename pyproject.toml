[project]
name = "causeway-bay-property-web"
version = "0.1.0"
description = "Daily property listings viewer for Causeway Bay, Hong Kong (HK$10M–20M)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.44.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
serve = "main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
